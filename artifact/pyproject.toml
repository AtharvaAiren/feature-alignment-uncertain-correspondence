[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-correspondence-audit-artifact"
version = "1.0.0"
description = "Anonymous experimental artifact for correspondence ambiguity and recovery audits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
analysis = ["scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.7", "highspy>=1.7"]
vision = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "transformers>=4.56", "huggingface-hub>=0.34", "safetensors>=0.4", "Pillow>=10"]
test = ["pytest>=7"]
all = ["scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.7", "highspy>=1.7", "torch>=2.2", "torchvision>=0.17", "timm>=1.0", "transformers>=4.56", "huggingface-hub>=0.34", "safetensors>=0.4", "Pillow>=10", "pytest>=7"]

[project.scripts]
correspondence-audit = "marginal_alignment.cli:main"
correspondence-campaign = "marginal_alignment.campaign.campaign:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]
markers = ["evidence_integrated: requires omitted execution-time source bytes"]

